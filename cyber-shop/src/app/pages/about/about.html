<section class="mx-auto max-w-xl px-5 pt-10">
  <p class="m-0 text-sm text-ice">implant.shop</p>
  <h1 class="mt-3 mb-0 text-3xl font-medium leading-tight">О нас</h1>
  <p class="mt-4 mb-0 text-base leading-relaxed text-muted">
    Учебный магазин кибер-имплантов: смотрите каталог, добавляйте товары в корзину и видите общую
    стоимость.
  </p>

  <div class="mt-6 flex flex-wrap gap-3">
    <a
      routerLink="/catalog"
      class="rounded-xs border border-ice px-3 py-1.5 text-sm text-ice hover:bg-ice hover:text-deep"
    >
      [ Каталог ]
    </a>
    <a
      routerLink="/cart"
      class="rounded-xs border border-line px-3 py-1.5 text-sm text-muted hover:border-line-strong hover:text-ink"
    >
      [ Корзина ]
    </a>
  </div>

  <h2 class="mt-11 mb-0 text-base font-medium">Команда</h2>
  <ul class="mt-5 mb-0 flex list-none flex-col gap-4 p-0">
    @for (member of team; track member.name) {
      <li class="rounded-xs border border-line bg-panel px-4 py-3">
        <p class="m-0 text-base font-medium">{{ member.name }}</p>
        <p class="mt-1 mb-0 text-sm text-ice">{{ member.role }}</p>
        <p class="mt-1 mb-0 text-sm text-muted">{{ member.work }}</p>
      </li>
    }
  </ul>
</section>
